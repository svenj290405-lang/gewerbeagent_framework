# DIES IST DER PRODUKTIV-STACK von gewerbeagent.de.
#
# Aufruf immer aus /opt/gewerbeagent/framework, ohne -f und ohne -p:
#   docker compose ps | restart framework | logs -f framework
# Damit gilt Projektname `framework` und die Volumes heissen
# framework_postgres_data, framework_caddy_* — genau die, in denen die
# echten Daten liegen.
#
# Vorgeschichte (Audit 2026-08-24): daneben lag ein `docker-compose.prod.yml`
# mit ANDEREN Volume-Namen (gewerbeagent_postgres_data). Es sah aus wie die
# Prod-Datei, war aber tote Dokumentation — ein gutgemeintes
# `docker compose -f docker-compose.prod.yml up -d` haette einen zweiten,
# LEEREN Stack neben dem laufenden hochgezogen. Die Datei ist deshalb weg;
# ihr Inhalt steht in der Git-Historie.
#
# Der framework-Container installiert seine Abhaengigkeiten beim Start
# (apt/pip/uv im `command`) — ohne erreichbares PyPI startet Produktion
# nicht. Bekannt, bewusst noch nicht umgebaut: ein Image-Build braucht
# einen eigenen Testlauf.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gewerbeagent_postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      POSTGRES_USER: gewerbeagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gewerbeagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gewerbeagent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  framework:
    image: python:3.12-slim
    container_name: gewerbeagent_framework
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    command: >
      bash -c "
      apt-get update && apt-get install -y --no-install-recommends curl &&
      pip install --no-cache-dir uv &&
      uv sync --frozen &&
      uv run alembic upgrade head &&
      uv run uvicorn core.api.app:app --host 0.0.0.0 --port 8001 --proxy-headers --forwarded-allow-ips='*'
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web

  caddy:
    image: caddy:2-alpine
    container_name: gewerbeagent_caddy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/gewerbeagent/website:/srv/website:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - framework
    networks:
      - web

networks:
  internal:
  web:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:
