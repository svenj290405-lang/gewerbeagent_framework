<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Muss dableiben: applyBrandColor() in app.js greift ungeprueft auf
       meta[name=theme-color] zu und wuerde ohne dieses Tag beim Start
       crashen. Den Wert zieht beta.js dann auf hell/dunkel passend nach. -->
  <meta name="theme-color" content="#ffffff" />
  <title>Gewerbeagent</title>
  <link rel="icon" type="image/svg+xml" href="/app/static/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/app/static/icon-192.png" />
  <link rel="apple-touch-icon" href="/app/static/apple-touch-icon.png" />
  <!-- Anders als beta.html: das Manifest bleibt — /app ist die installierbare
       Haupt-App auf dem Homescreen. -->
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="stylesheet" href="/app/static/app-beta.css" />
  <script>
    // Muss VOR dem ersten Paint laufen (darum inline, nicht in beta.js):
    // sonst blitzt bei gewaehltem Dunkelmodus kurz die helle Version auf.
    (function () {
      var t = null;
      try { t = localStorage.getItem("ga-theme"); } catch (e) { /* Privatmodus */ }
      document.documentElement.setAttribute(
        "data-theme", (t === "light" || t === "dark") ? t : "auto");
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <!-- iOS gibt installierten PWAs (display:standalone) KEINE Zurueck-Geste,
         weil die Safari-Oberflaeche fehlt. Dieser Pfeil ist darum die einzige
         plattformunabhaengige Zurueck-Moeglichkeit — app.js blendet ihn ein,
         sobald es einen History-Schritt zurueck gibt. -->
    <button id="back-btn" class="icon-btn hdr-back" aria-label="Zurück" hidden>‹</button>
    <span id="hdr-title">Gewerbeagent</span>
    <button id="notif-btn" class="icon-btn" title="Benachrichtigungen aktivieren" hidden>🔔</button>
  </header>

  <main id="view" class="view">
    <div class="loading">Lädt …</div>
  </main>

  <nav class="tabbar" id="tabbar"><!-- wird per JS gefüllt --></nav>

  <!-- Q-Overlay: Slide-up Panel für kontextuellen Q-Zugriff ohne Screen-Wechsel -->
  <div id="q-overlay" class="q-overlay" aria-label="Q Assistent" role="dialog" aria-modal="false">
    <div class="q-overlay-head">
      <span class="q-overlay-title">Q</span>
      <button class="q-overlay-close" id="q-overlay-close" title="Schließen" aria-label="Schließen">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
    <div id="q-overlay-msgs" class="q-overlay-msgs"></div>
    <div class="q-overlay-bar">
      <div class="q-ov-inputrow" id="q-ov-inputrow">
        <button class="cbtn q-overlay-mic-btn" id="q-overlay-mic" title="Tippen zum Sprechen" aria-label="Sprechen">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="11" rx="3"/>
            <path d="M5 10a7 7 0 0 0 14 0"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
            <line x1="8" y1="22" x2="16" y2="22"/>
          </svg>
        </button>
        <input id="q-overlay-input" type="text" placeholder="Frag Q …" autocomplete="off">
        <button class="cbtn" id="q-overlay-send" aria-label="Senden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="20" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/>
          </svg>
        </button>
      </div>
      <!-- Aufnahme-Leiste: tritt an die Stelle der Eingabezeile, solange Q
           zuhoert — gleiche Bedienung wie im Assistenten. -->
      <div class="q-recbar" id="q-ov-recbar" hidden>
        <button class="q-rec-x" id="q-ov-rec-cancel" title="Aufnahme verwerfen" aria-label="Aufnahme verwerfen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
        <span class="q-rec-dot" aria-hidden="true"></span>
        <span class="q-rec-time" id="q-ov-rec-time">0:00</span>
        <canvas class="q-rec-wave" id="q-ov-rec-wave" aria-hidden="true"></canvas>
        <button class="cbtn q-rec-go" id="q-ov-rec-send" title="Aufnahme senden" aria-label="Aufnahme senden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="20" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Seit 2026-07-17 ist das Beta-Design das Standard-Design: gleiches
       app.js, dazu app-beta.css + beta.js (Theme-Umschalter, theme-color,
       Kopfzeilen-Branding). Das alte Design liegt weiter in app.css. -->
  <script src="/app/static/app.js" defer></script>
  <!-- Muss NACH app.js laufen: wickelt applyBrandColor() ein und haengt den
       Hell/Dunkel-Umschalter in die Einstellungen. defer haelt die Reihenfolge. -->
  <script src="/app/static/beta.js" defer></script>
</body>
</html>
